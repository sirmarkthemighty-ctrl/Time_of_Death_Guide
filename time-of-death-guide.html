<style>

.bhr{display:flex;align-items:center;gap:4px;padding-right:8px}.clr{flex:0 0 auto;border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:8px;font-size:11px;font-weight:700;padding:5px 8px}.bh{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 12px;text-align:left}

.soft{margin-top:6px;padding:6px 8px;font-size:12px;background:var(--inset);border-left:3px dashed var(--mut);border-radius:6px}.soft.bad{color:var(--warn);border-left-color:var(--warn)}.softln{position:absolute;top:0;bottom:0;border-left:2px dashed var(--mut)}
.tl{position:relative}.dd{position:absolute;right:0;top:36px;z-index:40;width:min(100%,380px);max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.3);padding:8px}.ddi{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;margin-top:6px}.ddi span{display:block}.ddi:hover{background:var(--inset)}
.tgh{font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px;margin:12px 0 4px;border-left:4px solid var(--c);background:var(--inset)}.tax{position:sticky;top:-16px;z-index:3;background:var(--card);padding:4px 0 2px}.lb.wrap{white-space:normal}
.cs{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px}.csd{font-size:12px;color:var(--mut);margin:2px 0}.csn{font-size:12px;margin:4px 0}.csr{font-size:13px;margin:4px 0 6px}.csr b{color:var(--acc)}.csr b.bad{color:var(--warn)}
.nm{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.nm{grid-template-columns:repeat(3,1fr)}}.nm label{font-size:11px;font-weight:700;color:var(--mut)}.nm input,.nm select{width:100%;margin-top:2px;font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px}
.tscroll{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}.imt{border-collapse:collapse;font-size:11px;min-width:660px;width:100%}.imt th,.imt td{border:1px solid var(--bd);padding:3px 5px;text-align:center;white-space:nowrap}.imt th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
#ftxt{width:100%;font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical}.fh{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--bd);font-size:12px}.fh input{margin-top:3px}.fh small{display:block;color:var(--mut)}.fh0{font-size:12px;font-weight:700;margin:8px 0 2px}
.nst{margin-top:5px}.sr2{margin-top:3px;padding-left:8px;border-left:2px solid var(--bd)}.nab{position:absolute;left:6px;top:0;font-size:10px;line-height:14px;color:var(--mut)}
.tl{display:flex;gap:6px;margin-bottom:10px}.tl input{flex:1;min-width:0;font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:0 12px;height:30px}
.itw{display:flex;gap:5px;margin-bottom:5px}.itw .it{flex:1;min-width:0;margin-bottom:0}
.inf{flex:0 0 30px;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-weight:800;font-style:italic;color:var(--mut)}.inf.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.note2{font-size:11px;color:var(--mut);background:var(--inset);border-left:3px solid var(--acc);border-radius:6px;padding:6px 8px;margin:-2px 0 6px 28px;line-height:1.4}
.cbx.rd{border-radius:50%;font-size:10px}
.sg{display:grid;gap:8px}@media(min-width:640px){.sg{grid-template-columns:repeat(4,1fr)}}
.sl span{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:2px}.sl select{width:100%;font:inherit;font-size:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;text-overflow:ellipsis}
.bl{position:absolute;top:-17px;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--acc);white-space:nowrap}
.lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{font-size:10px;color:var(--mut);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}
.mb.wide{max-width:680px}
.sheet h1{font-size:18px;margin:0 0 8px}.sheet p{font-size:13px;margin:4px 0}.sheet .fine{font-size:10px;color:var(--mut)}
.st{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}.st th,.st td{border:1px solid var(--bd);padding:4px 6px;text-align:left}
#sheetp{display:none}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff!important;color:#000!important}.wrap,#bar,.mod{display:none!important}#sheetp{display:block}#sheetp *{color:#000!important;background:transparent!important;border-color:#999!important}}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--onacc);border-radius:8px;font-weight:700;font-size:12px;padding:6px 12px}
.btn.o{background:transparent;color:var(--acc)}
.mod{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px}
.mb{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:16px}
.mb h3{margin:0 0 8px;font-size:16px}.mb h4{margin:12px 0 2px;font-size:13px}.mb li{font-size:12px;margin:2px 0}

<body>
<div class="wrap">
  <div id="hd"></div>
  <div id="bar"></div>
  <div class="grid"><div id="list"></div><div id="sum"></div></div>
  <div id="refs"></div>
</div>
<div id="live" class="sr" role="status" aria-live="polite"></div><div id="modal"></div><div id="sheetp"></div>
<script>
/* ---------- data: hours since death; hi:null = no upper limit ---------- */
const CATS={rig:['Rigor stage','ระยะศพแข็ง'],mus:['Muscle reaction','ปฏิกิริยาของกล้ามเนื้อ'],iris:['Eye tests and signs','การทดสอบและสัญญาณที่ตา'],liv:['Livor mortis (lividity)','รอยจ้ำเลือดหลังตาย'],cool:['Cooling (algor mortis)','การเย็นลงของร่างกาย'],eye:['Cornea','กระจกตา'],stom:['Stomach','กระเพาะอาหาร'],dec:['Decomposition','การเน่าสลาย'],ins:['Insects','แมลง'],rem:['Long-term remains','สภาพศพระยะยาว']};
const GROUPS=[{id:'e',en:'Early signs (first ~2 days)',th:'สัญญาณระยะแรก (ประมาณ 2 วันแรก)',cats:['rig','mus','iris','liv','cool','eye']},{id:'l',en:'Late signs (days to years)',th:'สัญญาณระยะหลัง (หลายวันถึงหลายปี)',cats:['dec','ins','rem']}];
// [id, group, cat, lo, hi, reliability H/M/L, EN, TH, note EN, note TH]
const S=[
['flac','e','rig',0,7,'Primary flaccidity: limp, no stiffness yet','กล้ามเนื้ออ่อนปวกเปียก ยังไม่เริ่มแข็ง','No rigor yet means 7 h or less. Do not rely on the jaw-first order: the book lists many exceptions to Nysten\'s law.','ยังไม่มีศพแข็งหมายถึงไม่เกิน 7 ชม. อย่าพึ่งลำดับกรามก่อน เพราะตำราระบุข้อยกเว้นของกฎ Nysten หลายข้อ'],
['sup1','e','mus',0,2.5,'Tapping the thigh with a reflex hammer makes the whole muscle jump (Zsako phenomenon)','เคาะต้นขาด้วยค้อนเคาะแล้วกล้ามเนื้อทั้งมัดกระตุก (Zsako phenomenon)','Needs a hammer; the book notes few examiners have experience with it.','ต้องใช้ค้อนเคาะ ตำราระบุว่ามีผู้ตรวจที่ชำนาญน้อย'],
['sup2','e','mus',0,13,'Striking the biceps with the back of a knife leaves a local muscle bulge (idiomuscular contraction)','ใช้สันมีดตีกล้ามเนื้อต้นแขนแล้วเกิดก้อนนูนเฉพาะที่ (idiomuscular contraction)','A strong bulge lasts to about 4-5 h; a weak one can persist to 8-12 h.','ก้อนนูนชัดอยู่ได้ราว 4-5 ชม. ก้อนนูนอ่อนอาจอยู่ถึง 8-12 ชม.'],
['sup3','e','mus',0,6,'Electrical stimulation of the eyelid: the whole face reacts (strongest response, degree VI)','กระตุ้นไฟฟ้าที่เปลือกตา: ใบหน้าทั้งหมดตอบสนอง (ตอบสนองแรงสุด ระดับ VI)','Needs a stimulator with the settings in the book. Eyelid haematoma or emphysema lengthens the times; a long dying phase shortens them.','ต้องใช้เครื่องกระตุ้นตามค่าที่ตำราระบุ เลือดคั่งหรือลมใต้ผิวหนังเปลือกตาทำให้นานขึ้น ระยะสิ้นลมที่ยาวทำให้สั้นลง'],
['sup4','e','mus',5,22,'Electrical stimulation of the eyelid: only a small local twitch (degree I)','กระตุ้นไฟฟ้าที่เปลือกตา: กระตุกเฉพาะที่เล็กน้อย (ระดับ I)','No response above degree I means at least 5 h; a degree I twitch is seen only up to 22 h.','ไม่มีการตอบสนองสูงกว่าระดับ I แปลว่าอย่างน้อย 5 ชม. และพบระดับ I ได้ไม่เกิน 22 ชม.'],
['rig1','e','rig',0.5,7,'Rigor starting: jaw, eyelids, neck only','ศพแข็งเริ่มต้น เฉพาะกราม เปลือกตา คอ','Mean onset 3 h (limits 0.5-7 h). Small muscles stiffen before large ones, but the order has exceptions.','เริ่มเฉลี่ย 3 ชม. (0.5-7 ชม.) กล้ามเนื้อเล็กแข็งก่อนกล้ามเนื้อใหญ่ แต่ลำดับมีข้อยกเว้น'],
['rig2','e','rig',0.5,20,'Rigor spreading to the limbs, not yet full','ศพแข็งลามไปแขนขา แต่ยังไม่เต็มที่','Falls between the onset and the full-rigor limits; the book gives no separate figure.','อยู่ระหว่างขอบเขตของการเริ่มและการแข็งเต็มที่ ตำราไม่มีตัวเลขแยก'],
['rig3','e','rig',2,85,'Rigor full: large joints rigid, hard to break','ศพแข็งเต็มที่ ข้อใหญ่แข็ง งอยาก','Full from about 2-20 h (mean 8 h) and lasts a mean 57 h (limits 29-85 h). Cold prolongs it (still strong after 234 h at 4 C in one case); heat shortens it (none at under 8 h in a car at 40 C).','เต็มที่ราว 2-20 ชม. (เฉลี่ย 8 ชม.) และอยู่เฉลี่ย 57 ชม. (29-85 ชม.) ความเย็นทำให้นานขึ้น (ยังแข็งหลัง 234 ชม. ที่ 4 องศาในรายหนึ่ง) ความร้อนทำให้สั้นลง (ไม่พบเลยภายใน 8 ชม. ในรถที่ 40 องศา)'],
['rig4','e','rig',12,140,'Rigor passing: joints loosening again (secondary flaccidity)','ศพแข็งเริ่มคลาย ข้อกลับอ่อนอีกครั้ง','Mean resolution 76 h (limits 12-140 h). A cold body can stay stiff for days.','คลายเฉลี่ย 76 ชม. (12-140 ชม.) ศพที่เย็นอาจแข็งอยู่หลายวัน'],

en:['First release: checklist of early and late post-mortem signs.','Tick a sign to see the estimated time since death, a log-scale chart of every selected range, and the overlap of all of them.','Each group of signs has its own icon and colour, repeated on its bar in the chart.','Floating summary bar follows you down the list; tap it to open the full summary and chart, or tap Clear case to start over.','Rigor, livor, cooling, cornea and maggot stages are choose-one, and a Start here card sets the three most common ones.','Search box, a Key explaining every chip and colour, and an (i) button on each sign for its note.','Optional examination time gives the earliest and latest clock time of death.','Case sheet prints to A4.','Every sign has a source-check note under its (i) button: signs checked against Madea 2023 or Knight 2026 (page numbers given) carry the tick, the rest say Not verified. A ✅ marks the checked ones.','Rigor and livor ranges follow Madea 2023, Tables 11.1 and 11.2; muscle reactions split into four signs (Zsako, idiomuscular, two electrical grades).','Warm / cold to the touch, adipocere and insect signs now follow Knight 2026; maggots and pupae give a minimum time only.','Signs with only a baseline in Knight or Madea show it as a solid bar with a faded right end; signs with no figure show N/A. Baseline signs add a soft lower bound under the window; N/A signs are not used.','The (i) note lists Madea and Knight on separate rows.','A Table button beside Key opens every sign on one time scale; a Cases button beside it drops down four teaching examples that load into the checklist.','Rectal temperature calculator (Henssge nomogram, Madea 2023 Chapter 6.1) with the book\'s 95% variation, clothing and covering presets (Table 6.18) supporting-base corrections (Table 6.19) and weight adjustment of factors from 1.4 to 3.0 (Equation 6.10); its result can be used in the window.','New signs: rigor re-establishment, three iris-drug reactions, retinal trucking (baseline) and tache noire (N/A).','A Setting choice (hot or cold) adds a note on which ticked signs run faster or slower.','Decomposition ranges (green, marbling, bloating, blisters, hair and nails) now join Madea 2023 Tables 7.2 and 7.3 with Knight; mummification and skeletonised are baselines; Setting adds water and buried (Casper\'s rule).','Vitreous potassium calculator (Madea 2023, Section 7.2) with the book\'s 95% limits and the age and temperature model; Reh\'s immersion table (five rows) in the Table pop-up.','Keyboard and screen-reader support: pop-ups trap and restore focus, results are announced, chart bars and sign groups are labelled, and a visible focus ring.','A Describe the findings box turns free text, English or Thai, into ticked signs and fills the calculators. It uses plain keyword rules on the page and sends nothing anywhere.','DiMaio 2022 added as a third source in the (i) notes: it supports the livor and rigor ranges, gives faster decomposition figures (bloating now 60 h to 14 d), turns closed-eye cornea into a 24 h baseline, and disagrees that rigor can return after it is broken.','A Ranges from choice switches the whole app between DiMaio 2022 (main, figures for 16 of 36 signs, the rest N/A) and Madea 2023 + Knight 2026 (ranges with limits).','Stomach contents removed as a sign (published source calls it unacceptably imprecise).','References section (collapsed) with DOI links and what each is used for.','Bilingual (EN / TH), light and dark, works offline.'],
th:['เปิดตัวครั้งแรก: เช็กลิสต์สัญญาณหลังตายระยะแรกและระยะหลัง','ติ๊กสัญญาณเพื่อดูเวลาที่ผ่านไปหลังตาย กราฟแกนลอการิทึมของทุกช่วงที่เลือก และช่วงที่ทับซ้อนกัน','แต่ละกลุ่มสัญญาณมีไอคอนและสีของตัวเอง และใช้สีเดียวกันบนแถบในกราฟ','แถบสรุปลอยตามขณะเลื่อนรายการ แตะเพื่อเปิดสรุปและกราฟเต็ม หรือแตะล้างเคสเพื่อเริ่มใหม่','ระยะศพแข็ง รอยจ้ำเลือด การเย็นลง กระจกตา และหนอน เลือกได้ข้อเดียว และมีการ์ดเริ่มที่นี่สำหรับสามข้อที่พบบ่อย','ช่องค้นหา คำอธิบายสัญลักษณ์และสี และปุ่ม (i) ที่แต่ละสัญญาณสำหรับดูหมายเหตุ','ใส่เวลาตรวจศพเพื่อดูเวลาตายที่เร็วที่สุดและช้าที่สุด','ใบสรุปเคสพิมพ์ขนาด A4 ได้','ทุกสัญญาณมีหมายเหตุการตรวจแหล่งอ้างอิงใต้ปุ่ม (i) สัญญาณที่ตรวจกับ Madea 2023 หรือ Knight 2026 แล้ว (ระบุเลขหน้า) จะมีเครื่องหมายถูก ที่เหลือระบุว่ายังไม่ได้ตรวจสอบ ตรวจแล้วจะมี ✅','ช่วงเวลาของศพแข็งและรอยจ้ำเลือดตาม Madea 2023 ตาราง 11.1 และ 11.2 ปฏิกิริยาของกล้ามเนื้อแยกเป็นสี่สัญญาณ (Zsako idiomuscular และกระตุ้นไฟฟ้าสองระดับ)','ตัวอุ่น/เย็นเมื่อสัมผัส ไขมันศพ และสัญญาณแมลงตาม Knight 2026 หนอนและดักแด้ให้ได้เพียงเวลาขั้นต่ำ','สัญญาณที่มีเพียงเกณฑ์ทั่วไปใน Knight หรือ Madea แสดงเป็นแถบทึบที่ปลายขวาจาง ส่วนที่ไม่มีตัวเลขแสดง N/A เกณฑ์ทั่วไปเพิ่มขอบล่างแบบอ่อนใต้ช่วงเวลา ส่วน N/A ไม่ใช้คำนวณ','หมายเหตุ (i) แยก Madea และ Knight คนละบรรทัด','ปุ่มตารางข้างปุ่มคำอธิบายเปิดตารางสัญญาณทั้งหมดบนแกนเวลาเดียว และปุ่มตัวอย่างเคสข้างกันเปิดรายการตัวอย่างสี่เคสที่โหลดลงเช็กลิสต์ได้','เครื่องคำนวณอุณหภูมิทางทวารหนัก (Henssge nomogram จาก Madea 2023 บทที่ 6.1) พร้อมความแปรผัน 95% ของตำรา ตัวเลือกเสื้อผ้าและการห่ม (ตาราง 6.18) การแก้ตามพื้นที่นอน (ตาราง 6.19) และการปรับตัวคูณตามน้ำหนักเมื่อ 1.4-3.0 (สมการ 6.10) ผลลัพธ์ใช้ในช่วงเวลาได้','สัญญาณใหม่: ศพแข็งกลับมา ปฏิกิริยาม่านตาต่อยาสามชนิด retinal trucking (เกณฑ์ทั่วไป) และ tache noire (N/A)','ตัวเลือกสภาพแวดล้อม (ร้อนหรือเย็น) เพิ่มหมายเหตุว่าสัญญาณที่เลือกอันใดเกิดเร็วหรือช้าลง','ช่วงเวลาของการเน่า (เขียว ลายเส้นเลือด บวม ตุ่มน้ำ ผมและเล็บ) รวม Madea 2023 ตาราง 7.2 และ 7.3 กับ Knight ส่วนมัมมี่และกระดูกล้วนเป็นเกณฑ์ทั่วไป ตัวเลือกสภาพแวดล้อมเพิ่มน้ำและฝังดิน (กฎของ Casper)','เครื่องคำนวณโพแทสเซียมในน้ำวุ้นตา (Madea 2023 หัวข้อ 7.2) พร้อมขอบเขต 95% ของตำราและแบบจำลองอายุกับอุณหภูมิ และตารางการแช่น้ำของ Reh (ห้าแถว) ในหน้าต่างตาราง','รองรับแป้นพิมพ์และโปรแกรมอ่านหน้าจอ: หน้าต่างป๊อปอัปจับและคืนโฟกัส ประกาศผลลัพธ์ ติดป้ายแท่งกราฟและกลุ่มสัญญาณ และมีกรอบโฟกัสที่มองเห็นได้','ช่องบรรยายสิ่งที่พบแปลงข้อความอิสระภาษาอังกฤษหรือไทยเป็นสัญญาณที่ติ๊กและใส่ค่าในเครื่องคำนวณ ใช้กฎจับคำสำคัญในหน้าเท่านั้น ไม่ส่งข้อมูลไปที่ใด','เพิ่ม DiMaio 2022 เป็นแหล่งที่สามในหมายเหตุ (i): สนับสนุนช่วงเวลาของรอยจ้ำเลือดและศพแข็ง ให้ตัวเลขการเน่าที่เร็วกว่า (บวมตอนนี้ 60 ชม. ถึง 14 วัน) เปลี่ยนกระจกตาของตาที่ปิดเป็นเกณฑ์ 24 ชม. และขัดแย้งเรื่องศพแข็งกลับมาหลังถูกหัก','ตัวเลือกช่วงเวลาจากสลับทั้งแอประหว่าง DiMaio 2022 (หลัก มีตัวเลข 16 จาก 36 สัญญาณ ที่เหลือ N/A) และ Madea 2023 + Knight 2026 (ช่วงที่มีขอบเขต)','นำเนื้อหากระเพาะอาหารออกจากสัญญาณ (แหล่งตีพิมพ์ว่าไม่แม่นยำเกินรับได้)','ส่วนเอกสารอ้างอิง (พับไว้) พร้อมลิงก์ DOI และระบุว่าใช้ทำอะไร','สองภาษา (EN / TH) โหมดสว่างและมืด ใช้ออฟไลน์ได้']}];

function nomoCw(c70,bw){const S=-3.24596*Math.exp(-0.89959*c70),d=(Math.pow(bw,-0.625)-0.028)*S-0.0354;return Math.pow(-1.2815/d,1.6)/bw}
function nomoRes(){const tr=parseFloat(nomoIn.tr),ta=parseFloat(nomoIn.ta),bw=parseFloat(nomoIn.bw),cf=parseFloat(nomoIn.cf);
 if(![tr,ta,bw,cf].every(isFinite)||bw<=0||cf<=0)return null;
 if(ta>=37.2)return{msg:t('Ambient temperature must be below 37.2 C.','อุณหภูมิแวดล้อมต้องต่ำกว่า 37.2 องศา')};
 const q=(tr-ta)/(37.2-ta);
 if(q>=1)return{msg:t('Rectal temperature is still on the plateau (Q of 1 or more): too early for this method. Use the other signs.','อุณหภูมิทางทวารหนักยังอยู่ในช่วง plateau (Q ตั้งแต่ 1 ขึ้นไป) เร็วเกินไปสำหรับวิธีนี้ ให้ใช้สัญญาณอื่น')};
 if(q<=0)return{msg:t('The body is at or below ambient temperature: this method cannot estimate.','ร่างกายเท่าหรือต่ำกว่าอุณหภูมิแวดล้อม วิธีนี้ประเมินไม่ได้')};
 const adj=cf>=1.4&&cf<=3,ce=adj?nomoCw(cf,bw):cf,B=-1.2815*Math.pow(ce*bw,-0.625)+0.0284,A=ta>23?1.11:1.25,k=ta>23?10:5,f=x=>A*Math.exp(B*x)-(A-1)*Math.exp(k*B*x);
 let lo=0,hi=2000;for(let i=0;i<80;i++){const m=(lo+hi)/2;f(m)>q?lo=m:hi=m}
 const tt=(lo+hi)/2,v=q>=.5?2.8:q>=.3?3.2:q>=.2?4.5:null;
 return{t:tt,q,v,cf,ce,adj,bw,lo:v===null?null:Math.max(0,tt-v),hi:v===null?null:tt+v}}
function nomoOut(r){const w=r&&!r.msg?(r.adj?`<p class="csd">${t(`Weight adjustment (Madea 2023, Equation 6.10): the factor ${r.cf} is for a 70 kg body; for ${r.bw} kg it is ${r.ce.toFixed(2)}.`,`การปรับตามน้ำหนัก (Madea 2023 สมการ 6.10): ตัวคูณ ${r.cf} ใช้กับร่างกาย 70 กก. สำหรับ ${r.bw} กก. เป็น ${r.ce.toFixed(2)}`)}</p>`:(r.cf>3||r.cf<0.75?`<p class="csd" style="color:var(--warn)">${t('A factor outside 0.75 to 3.0 is outside what the book tested.','ตัวคูณนอกช่วง 0.75 ถึง 3.0 อยู่นอกสิ่งที่ตำราทดสอบ')}</p>`:'')):'';return w+nomoOut0(r)}

function parseText(raw){
 const txt=String(raw||'').toLowerCase().replace(/\s+/g,' ').trim(),out={hits:[],also:[],vals:{},notes:[]};if(!txt)return out;
 const clauses=txt.split(/[.;\n]+|,|\s(?:and|but|with|while|plus)\s/).map(c=>c.trim()).filter(Boolean),taken={};
 for(const [id,en,th] of RULES){const s=S.find(x=>x.id===id);if(!s)continue;let why=null;
  for(const c of clauses)if(en.test(c)){why=c;break}
  if(!why&&th&&th.test(txt))why=txt.match(th)[0];
  if(!why)continue;
  const fam=FAMS.includes(s.c)?s.c:null;
  if(fam&&taken[fam]){out.also.push({id,why});continue}
  if(out.hits.some(h=>h.id===id))continue;
  if(fam)taken[fam]=id;out.hits.push({id,why})}
 if(/(?:cornea|corneal|กระจกตา).*(?:hazy|cloud|opaque|ขุ่น)/.test(txt)&&!out.hits.some(h=>h.id==='eye1'||h.id==='eye2'))out.notes.push(t('Cornea hazy: say whether the eyes were open or closed.','กระจกตาขุ่น: ระบุว่าตาเปิดหรือปิด'));
 if(/(?:rigor|rigid|stiff|ศพแข็ง)/.test(txt)&&!out.hits.some(h=>RIGIDS.includes(h.id)))out.notes.push(t('Rigor mentioned but its stage is not clear: say jaw only, spreading, full or passing.','กล่าวถึงศพแข็งแต่ไม่ชัดว่าระยะใด: ระบุว่าเฉพาะกราม ลามไป เต็มที่ หรือคลาย'));
 if(/(?:livor|lividity|hypostasis|รอยจ้ำ)/.test(txt)&&!out.hits.some(h=>h.id.startsWith('liv')))out.notes.push(t('Livor mentioned but its state is not clear: say blanches, partly fixed or fixed.','กล่าวถึงรอยจ้ำเลือดแต่ไม่ชัดว่าสถานะใด: ระบุว่ากดจาง คงที่บางส่วน หรือคงที่'));
 const num=(re,i)=>{const m=txt.match(re);return m?m[i||1]:null};
 const tr=num(/(?:rectal|rectum|core|ทวารหนัก)[^0-9]{0,25}?(\d{2}(?:\.\d+)?)/),ta=num(/(?:ambient|room|air|environment(?:al)?|แวดล้อม|อากาศ)(?: temp(?:erature)?)?[^0-9]{0,15}?(\d{1,2}(?:\.\d+)?)/),
  bw=num(/(\d{2,3}(?:\.\d+)?)\s*(?:kg|kilo|กก)/)||num(/(?:weight|น้ำหนัก)[^0-9]{0,10}(\d{2,3}(?:\.\d+)?)/),k=num(/(?:potassium|\bk\+|โพแทสเซียม)[^0-9]{0,20}?(\d{1,2}(?:\.\d+)?)/);
 if(tr)out.vals.tr=tr;if(ta)out.vals.ta=ta;if(bw)out.vals.bw=bw;if(k)out.vals.k=k;
 return out}

 if(!r.hits.length&&!r.notes.length&&!Object.keys(r.vals).length)return`<p class="csd">${t('No signs recognised. Try words like: body warm, rigor in the jaw, livor fixed, green abdomen, marbling, large maggots.','ไม่พบสัญญาณ ลองใช้คำเช่น: ตัวอุ่น ศพแข็งที่กราม รอยจ้ำเลือดคงที่ ท้องเขียว ลายเส้นเลือด หนอนตัวโต')}</p>`;
 const v=r.vals,vt=[v.tr&&t('rectal','ทวารหนัก')+' '+v.tr+' °C',v.ta&&t('ambient','แวดล้อม')+' '+v.ta+' °C',v.bw&&v.bw+' kg',v.k&&'K+ '+v.k+' mmol/L'].filter(Boolean).join(' · ');
 return(r.hits.length?`<div class="fh0">${t('Found these signs. Untick any that are wrong.','พบสัญญาณเหล่านี้ เอาเครื่องหมายออกถ้าไม่ถูก')}</div>`+r.hits.map(h=>{const s=S.find(x=>x.id===h.id);return`<label class="fh"><input type="checkbox" data-fchk="${h.id}" ${fchk.has(h.id)?'checked':''}><span><b>${nm(h.id)}</b> <span class="chip r" style="--c:${col(s)}">${range(s)}</span><small>"${esc(h.why)}"</small></span></label>`}).join(''):'')

function softTxt(e){if(e.soft==null||e.onlyBl||e.onlyNa||e.conflict)return'';const m=Math.max(e.lo,e.soft),r=e.hi===null?'> '+fmt(m):fmt(m)+' - '+fmt(e.hi);

<style>

.ax span{position:absolute;top:2px;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}

.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

#bar{position:sticky;top:8px;z-index:30}
.bw{background:var(--card);border:1px solid var(--acc);border-radius:14px;box-shadow:0 6px 18px rgba(15,23,42,.25);margin-bottom:10px;overflow:hidden}
.bhr{display:flex;align-items:center;gap:4px;padding-right:8px}.clr{flex:0 0 auto;border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:8px;font-size:11px;font-weight:700;padding:5px 8px}.bh{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 12px;text-align:left}
.bt{display:flex;flex-direction:column;min-width:0}.bt b{font-size:16px;font-weight:800;color:var(--acc);line-height:1.15}.bt b.bad{color:var(--warn)}.bt small{font-size:10px;color:var(--mut)}

.pan{border-top:1px solid var(--bd);max-height:calc(100vh - 90px);overflow:auto}.pan .card{border:0;border-radius:0;box-shadow:none;margin:0}
@media(max-width:1023px){#sum{display:none}}
.rf{margin-top:8px}.rf .ch{border-left:0;border-radius:14px;border:1px solid var(--bd)}.rf h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--bd)}
.rf ol{margin:0;padding:0;list-style:none}.rf li{display:flex;gap:8px;font-size:12px;line-height:1.5;margin-bottom:8px}.rf li>b{flex:0 0 22px;text-align:right;color:var(--mut)}.rf li div{min-width:0}.rf a{color:var(--acc);word-break:break-all}.rf small{display:block;font-size:11px;color:var(--mut)}.rf .fine{font-size:11px;color:var(--mut);margin-top:10px}
.soft{margin-top:6px;padding:6px 8px;font-size:12px;background:var(--inset);border-left:3px dashed var(--mut);border-radius:6px}.soft.bad{color:var(--warn);border-left-color:var(--warn)}.softln{position:absolute;top:0;bottom:0;border-left:2px dashed var(--mut)}
.tl{position:relative}.dd{position:absolute;right:0;top:36px;z-index:40;width:min(100%,380px);max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.3);padding:8px}.ddi{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;margin-top:6px}.ddi span{display:block}.ddi:hover{background:var(--inset)}
.tgh{font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px;margin:12px 0 4px;border-left:4px solid var(--c);background:var(--inset)}.tax{position:sticky;top:-16px;z-index:3;background:var(--card);padding:4px 0 2px}.lb.wrap{white-space:normal}
.cs{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px}.csd{font-size:12px;color:var(--mut);margin:2px 0}.csn{font-size:12px;margin:4px 0}.csr{font-size:13px;margin:4px 0 6px}.csr b{color:var(--acc)}.csr b.bad{color:var(--warn)}
.nm{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.nm{grid-template-columns:repeat(3,1fr)}}.nm label{font-size:11px;font-weight:700;color:var(--mut)}.nm input,.nm select{width:100%;margin-top:2px;font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px}
.nst{margin-top:5px}.sr2{margin-top:3px;padding-left:8px;border-left:2px solid var(--bd)}.nab{position:absolute;left:6px;top:0;font-size:10px;line-height:14px;color:var(--mut)}
.tl{display:flex;gap:6px;margin-bottom:10px}.tl input{flex:1;min-width:0;font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:0 12px;height:30px}
.itw{display:flex;gap:5px;margin-bottom:5px}.itw .it{flex:1;min-width:0;margin-bottom:0}
.inf{flex:0 0 30px;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-weight:800;font-style:italic;color:var(--mut)}.inf.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.note2{font-size:11px;color:var(--mut);background:var(--inset);border-left:3px solid var(--acc);border-radius:6px;padding:6px 8px;margin:-2px 0 6px 28px;line-height:1.4}
.cbx.rd{border-radius:50%;font-size:10px}
.sg{display:grid;gap:8px}@media(min-width:640px){.sg{grid-template-columns:repeat(4,1fr)}}
.sl span{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:2px}.sl select{width:100%;font:inherit;font-size:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;text-overflow:ellipsis}
.bl{position:absolute;top:-17px;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--acc);white-space:nowrap}
.lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{font-size:10px;color:var(--mut);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}
.mb.wide{max-width:680px}
.sheet h1{font-size:18px;margin:0 0 8px}.sheet p{font-size:13px;margin:4px 0}.sheet .fine{font-size:10px;color:var(--mut)}
.st{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}.st th,.st td{border:1px solid var(--bd);padding:4px 6px;text-align:left}
#sheetp{display:none}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff!important;color:#000!important}.wrap,#bar,.mod{display:none!important}#sheetp{display:block}#sheetp *{color:#000!important;background:transparent!important;border-color:#999!important}}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;font-weight:700;font-size:12px;padding:6px 12px}
.btn.o{background:transparent;color:var(--acc)}
.mod{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px}
.mb{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:16px}
.mb h3{margin:0 0 8px;font-size:16px}.mb h4{margin:12px 0 2px;font-size:13px}.mb li{font-size:12px;margin:2px 0}
</style>

<body>
<div class="wrap">
  <div id="hd"></div>

</div>

<script>
/* ---------- data: hours since death; hi:null = no upper limit ---------- */
const CATS={rig:['Rigor stage','ระยะศพแข็ง'],mus:['Muscle reaction','ปฏิกิริยาของกล้ามเนื้อ'],iris:['Eye tests and signs','การทดสอบและสัญญาณที่ตา'],liv:['Livor mortis (lividity)','รอยจ้ำเลือดหลังตาย'],cool:['Cooling (algor mortis)','การเย็นลงของร่างกาย'],eye:['Cornea','กระจกตา'],stom:['Stomach','กระเพาะอาหาร'],dec:['Decomposition','การเน่าสลาย'],ins:['Insects','แมลง'],rem:['Long-term remains','สภาพศพระยะยาว']};
const GROUPS=[{id:'e',en:'Early signs (first ~2 days)',th:'สัญญาณระยะแรก (ประมาณ 2 วันแรก)',cats:['rig','mus','iris','liv','cool','eye']},{id:'l',en:'Late signs (days to years)',th:'สัญญาณระยะหลัง (หลายวันถึงหลายปี)',cats:['dec','ins','rem']}];
// [id, group, cat, lo, hi, reliability H/M/L, EN, TH, note EN, note TH]
const S=[
['flac','e','rig',0,7,'Primary flaccidity: limp, no stiffness yet','กล้ามเนื้ออ่อนปวกเปียก ยังไม่เริ่มแข็ง','No rigor yet means 7 h or less. Do not rely on the jaw-first order: the book lists many exceptions to Nysten\'s law.','ยังไม่มีศพแข็งหมายถึงไม่เกิน 7 ชม. อย่าพึ่งลำดับกรามก่อน เพราะตำราระบุข้อยกเว้นของกฎ Nysten หลายข้อ'],
['sup1','e','mus',0,2.5,'Tapping the thigh with a reflex hammer makes the whole muscle jump (Zsako phenomenon)','เคาะต้นขาด้วยค้อนเคาะแล้วกล้ามเนื้อทั้งมัดกระตุก (Zsako phenomenon)','Needs a hammer; the book notes few examiners have experience with it.','ต้องใช้ค้อนเคาะ ตำราระบุว่ามีผู้ตรวจที่ชำนาญน้อย'],
['sup2','e','mus',0,13,'Striking the biceps with the back of a knife leaves a local muscle bulge (idiomuscular contraction)','ใช้สันมีดตีกล้ามเนื้อต้นแขนแล้วเกิดก้อนนูนเฉพาะที่ (idiomuscular contraction)','A strong bulge lasts to about 4-5 h; a weak one can persist to 8-12 h.','ก้อนนูนชัดอยู่ได้ราว 4-5 ชม. ก้อนนูนอ่อนอาจอยู่ถึง 8-12 ชม.'],
['sup3','e','mus',0,6,'Electrical stimulation of the eyelid: the whole face reacts (strongest response, degree VI)','กระตุ้นไฟฟ้าที่เปลือกตา: ใบหน้าทั้งหมดตอบสนอง (ตอบสนองแรงสุด ระดับ VI)','Needs a stimulator with the settings in the book. Eyelid haematoma or emphysema lengthens the times; a long dying phase shortens them.','ต้องใช้เครื่องกระตุ้นตามค่าที่ตำราระบุ เลือดคั่งหรือลมใต้ผิวหนังเปลือกตาทำให้นานขึ้น ระยะสิ้นลมที่ยาวทำให้สั้นลง'],
['sup4','e','mus',5,22,'Electrical stimulation of the eyelid: only a small local twitch (degree I)','กระตุ้นไฟฟ้าที่เปลือกตา: กระตุกเฉพาะที่เล็กน้อย (ระดับ I)','No response above degree I means at least 5 h; a degree I twitch is seen only up to 22 h.','ไม่มีการตอบสนองสูงกว่าระดับ I แปลว่าอย่างน้อย 5 ชม. และพบระดับ I ได้ไม่เกิน 22 ชม.'],
['rig1','e','rig',0.5,7,'Rigor starting: jaw, eyelids, neck only','ศพแข็งเริ่มต้น เฉพาะกราม เปลือกตา คอ','Mean onset 3 h (limits 0.5-7 h). Small muscles stiffen before large ones, but the order has exceptions.','เริ่มเฉลี่ย 3 ชม. (0.5-7 ชม.) กล้ามเนื้อเล็กแข็งก่อนกล้ามเนื้อใหญ่ แต่ลำดับมีข้อยกเว้น'],
['rig2','e','rig',0.5,20,'Rigor spreading to the limbs, not yet full','ศพแข็งลามไปแขนขา แต่ยังไม่เต็มที่','Falls between the onset and the full-rigor limits; the book gives no separate figure.','อยู่ระหว่างขอบเขตของการเริ่มและการแข็งเต็มที่ ตำราไม่มีตัวเลขแยก'],
['rig3','e','rig',2,85,'Rigor full: large joints rigid, hard to break','ศพแข็งเต็มที่ ข้อใหญ่แข็ง งอยาก','Full from about 2-20 h (mean 8 h) and lasts a mean 57 h (limits 29-85 h). Cold prolongs it (still strong after 234 h at 4 C in one case); heat shortens it (none at under 8 h in a car at 40 C).','เต็มที่ราว 2-20 ชม. (เฉลี่ย 8 ชม.) และอยู่เฉลี่ย 57 ชม. (29-85 ชม.) ความเย็นทำให้นานขึ้น (ยังแข็งหลัง 234 ชม. ที่ 4 องศาในรายหนึ่ง) ความร้อนทำให้สั้นลง (ไม่พบเลยภายใน 8 ชม. ในรถที่ 40 องศา)'],
['rig4','e','rig',12,140,'Rigor passing: joints loosening again (secondary flaccidity)','ศพแข็งเริ่มคลาย ข้อกลับอ่อนอีกครั้ง','Mean resolution 76 h (limits 12-140 h). A cold body can stay stiff for days.','คลายเฉลี่ย 76 ชม. (12-140 ชม.) ศพที่เย็นอาจแข็งอยู่หลายวัน'],
['liv0','e','liv',0,3,'Pallor: no livor visible yet','ผิวซีด ยังไม่เห็นรอยจ้ำเลือด','',''],
['liv1','e','liv',0,6,'Livor visible; blanches fully on pressure and moves completely if the body is turned','พบรอยจ้ำเลือด กดแล้วจางหมด และย้ายที่ทั้งหมดเมื่อพลิกตัว','Livor starts within 20-30 min.','รอยจ้ำเลือดเริ่มภายใน 20-30 นาที'],

['liv3','e','liv',4,null,'Livor fixed: does not move when the body is turned','รอยจ้ำเลือดคงที่ ไม่ย้ายที่เมื่อพลิกตัว','A minimum age only. If it does not match the position found, the body was moved after fixing.','บอกได้เพียงอายุขั้นต่ำ ถ้าไม่ตรงกับท่าที่พบ แสดงว่าศพถูกย้ายหลังรอยคงที่'],

en:['First release: checklist of early and late post-mortem signs.','Tick a sign to see the estimated time since death, a log-scale chart of every selected range, and the overlap of all of them.','Each group of signs has its own icon and colour, repeated on its bar in the chart.','Floating summary bar follows you down the list; tap it to open the full summary and chart, or tap Clear case to start over.','Rigor, livor, cooling, cornea and maggot stages are choose-one, and a Start here card sets the three most common ones.','Search box, a Key explaining every chip and colour, and an (i) button on each sign for its note.','Optional examination time gives the earliest and latest clock time of death.','Case sheet prints to A4.','Every sign has a source-check note under its (i) button: signs checked against Madea 2023 or Knight 2026 (page numbers given) carry the tick, the rest say Not verified. A ✅ marks the checked ones.','Rigor and livor ranges follow Madea 2023, Tables 11.1 and 11.2; muscle reactions split into four signs (Zsako, idiomuscular, two electrical grades).','Warm / cold to the touch, adipocere and insect signs now follow Knight 2026; maggots and pupae give a minimum time only.','Signs with only a baseline in Knight or Madea show it as a solid bar with a faded right end; signs with no figure show N/A. Baseline signs add a soft lower bound under the window; N/A signs are not used.','The (i) note lists Madea and Knight on separate rows.','A Table button beside Key opens every sign on one time scale; a Cases button beside it drops down four teaching examples that load into the checklist.','Rectal temperature calculator (Henssge nomogram, Madea 2023 Chapter 6.1) with the book\'s 95% variation, clothing and covering presets (Table 6.18) and supporting-base corrections (Table 6.19); its result can be used in the window.','New signs: rigor re-establishment, three iris-drug reactions, retinal trucking (baseline) and tache noire (N/A).','A Setting choice (hot or cold) adds a note on which ticked signs run faster or slower.','Decomposition ranges (green, marbling, bloating, blisters, hair and nails) now join Madea 2023 Tables 7.2 and 7.3 with Knight; mummification and skeletonised are baselines; Setting adds water and buried (Casper\'s rule).','Stomach contents removed as a sign (published source calls it unacceptably imprecise).','References section (collapsed) with DOI links and what each is used for.','Bilingual (EN / TH), light and dark, works offline.'],
th:['เปิดตัวครั้งแรก: เช็กลิสต์สัญญาณหลังตายระยะแรกและระยะหลัง','ติ๊กสัญญาณเพื่อดูเวลาที่ผ่านไปหลังตาย กราฟแกนลอการิทึมของทุกช่วงที่เลือก และช่วงที่ทับซ้อนกัน','แต่ละกลุ่มสัญญาณมีไอคอนและสีของตัวเอง และใช้สีเดียวกันบนแถบในกราฟ','แถบสรุปลอยตามขณะเลื่อนรายการ แตะเพื่อเปิดสรุปและกราฟเต็ม หรือแตะล้างเคสเพื่อเริ่มใหม่','ระยะศพแข็ง รอยจ้ำเลือด การเย็นลง กระจกตา และหนอน เลือกได้ข้อเดียว และมีการ์ดเริ่มที่นี่สำหรับสามข้อที่พบบ่อย','ช่องค้นหา คำอธิบายสัญลักษณ์และสี และปุ่ม (i) ที่แต่ละสัญญาณสำหรับดูหมายเหตุ','ใส่เวลาตรวจศพเพื่อดูเวลาตายที่เร็วที่สุดและช้าที่สุด','ใบสรุปเคสพิมพ์ขนาด A4 ได้','ทุกสัญญาณมีหมายเหตุการตรวจแหล่งอ้างอิงใต้ปุ่ม (i) สัญญาณที่ตรวจกับ Madea 2023 หรือ Knight 2026 แล้ว (ระบุเลขหน้า) จะมีเครื่องหมายถูก ที่เหลือระบุว่ายังไม่ได้ตรวจสอบ ตรวจแล้วจะมี ✅','ช่วงเวลาของศพแข็งและรอยจ้ำเลือดตาม Madea 2023 ตาราง 11.1 และ 11.2 ปฏิกิริยาของกล้ามเนื้อแยกเป็นสี่สัญญาณ (Zsako idiomuscular และกระตุ้นไฟฟ้าสองระดับ)','ตัวอุ่น/เย็นเมื่อสัมผัส ไขมันศพ และสัญญาณแมลงตาม Knight 2026 หนอนและดักแด้ให้ได้เพียงเวลาขั้นต่ำ','สัญญาณที่มีเพียงเกณฑ์ทั่วไปใน Knight หรือ Madea แสดงเป็นแถบทึบที่ปลายขวาจาง ส่วนที่ไม่มีตัวเลขแสดง N/A เกณฑ์ทั่วไปเพิ่มขอบล่างแบบอ่อนใต้ช่วงเวลา ส่วน N/A ไม่ใช้คำนวณ','หมายเหตุ (i) แยก Madea และ Knight คนละบรรทัด','ปุ่มตารางข้างปุ่มคำอธิบายเปิดตารางสัญญาณทั้งหมดบนแกนเวลาเดียว และปุ่มตัวอย่างเคสข้างกันเปิดรายการตัวอย่างสี่เคสที่โหลดลงเช็กลิสต์ได้','เครื่องคำนวณอุณหภูมิทางทวารหนัก (Henssge nomogram จาก Madea 2023 บทที่ 6.1) พร้อมความแปรผัน 95% ของตำรา ตัวเลือกเสื้อผ้าและการห่ม (ตาราง 6.18) และการแก้ตามพื้นที่นอน (ตาราง 6.19) ผลลัพธ์ใช้ในช่วงเวลาได้','สัญญาณใหม่: ศพแข็งกลับมา ปฏิกิริยาม่านตาต่อยาสามชนิด retinal trucking (เกณฑ์ทั่วไป) และ tache noire (N/A)','ตัวเลือกสภาพแวดล้อม (ร้อนหรือเย็น) เพิ่มหมายเหตุว่าสัญญาณที่เลือกอันใดเกิดเร็วหรือช้าลง','ช่วงเวลาของการเน่า (เขียว ลายเส้นเลือด บวม ตุ่มน้ำ ผมและเล็บ) รวม Madea 2023 ตาราง 7.2 และ 7.3 กับ Knight ส่วนมัมมี่และกระดูกล้วนเป็นเกณฑ์ทั่วไป ตัวเลือกสภาพแวดล้อมเพิ่มน้ำและฝังดิน (กฎของ Casper)','นำเนื้อหากระเพาะอาหารออกจากสัญญาณ (แหล่งตีพิมพ์ว่าไม่แม่นยำเกินรับได้)','ส่วนเอกสารอ้างอิง (พับไว้) พร้อมลิงก์ DOI และระบุว่าใช้ทำอะไร','สองภาษา (EN / TH) โหมดสว่างและมืด ใช้ออฟไลน์ได้']}];

 const rows=c.map(s=>trow(s)).join('');
 return `<section class="card"><div class="sec"><h2>${t('Estimated time since death','เวลาที่ผ่านไปหลังตาย')}</h2>
 <div class="big ${e.conflict?'bad':''}">${headline(e)}</div><div class="sub">${sub}</div>${sf?`<div class="soft ${e.softConflict?'bad':''}">${sf}</div>`:''}${adv?`<div class="soft">${adv}</div>`:''}${clock}
 <div class="chart"><div class="rows">${firm?`<div class="bl" style="left:${mid}%">${headline(e)}</div>`:''}<div style="position:absolute;inset:0;pointer-events:none">${TICKS.map(k=>`<div class="gl" style="left:${pos(k[0])}%"></div>`).join('')}${firm?`<div class="band" style="left:${bL}%;width:${Math.max(bR-bL,.6)}%"></div>`:''}${firm&&e.soft!=null?`<div class="softln" style="left:${pos(e.soft)}%"></div>`:''}</div>${rows}</div>
 <div class="ax">${TICKS.map(k=>`<span style="left:${pos(k[0])}%">${k[L()+1]}</span>`).join('')}</div>
 <div class="cap">${t('0 = time of examination. Time since death runs to the right (log scale).','0 = เวลาที่ตรวจศพ เวลาหลังตายเพิ่มไปทางขวา (แกนลอการิทึม)')}</div>
 <div class="key">${[...new Set(c.map(x=>x.c))].map(k=>`<span><i style="background:var(--k-${k})"></i>${CI[k]} ${CATS[k][L()]}</span>`).join('')}<span><i style="background:var(--acc);opacity:.4"></i>${t('Overlap of all ticked signs','ช่วงที่ทับซ้อนกันทุกสัญญาณ')}</span><span><i style="background:linear-gradient(to right,var(--mut),transparent)"></i>${t('Faded end = unknown end','ปลายจาง = ไม่ทราบช่วงสิ้นสุด')}</span>${e.soft!=null&&firm?`<span>┆ ${t('Dashed line = baseline (soft lower bound)','เส้นประ = เกณฑ์ทั่วไป (ขอบล่างแบบอ่อน)')}</span>`:''}</div></div>
 <div class="acts"><button class="btn" data-act="sheet">${t('Case sheet','ใบสรุปเคส')}</button><button class="btn o" data-act="clear">${t('Clear all','ล้างทั้งหมด')}</button></div></div></section>`}
function summary(){const e=estimate();$('sum').innerHTML=`<div class="stick">${e?sumCard(e):`<section class="card"><div class="sec"><h2>${t('Estimated time since death','เวลาที่ผ่านไปหลังตาย')}</h2><div class="empty">${t('Nothing ticked yet. Tick one or more signs on the checklist and the summary and graph appear here.','ยังไม่ได้เลือก ติ๊กสัญญาณจากเช็กลิสต์ แล้วสรุปและกราฟจะแสดงที่นี่')}</div></div></section>`}</div>`}
function bar(){const e=estimate();if(!e){barOpen=false;$('bar').innerHTML='';return}
 const mini=e.conflict||e.onlyNa?'':`<span class="mini"><i style="left:${pos(e.lo)}%;width:${Math.max((e.hi===null?100:pos(e.hi))-pos(e.lo),1.5)}%"></i></span>`;
 $('bar').innerHTML=`<div class="bw"><div class="bhr"><button class="bh" data-act="bar" aria-expanded="${barOpen}" aria-label="${t('Summary','สรุป')}"><span class="bt"><b class="${e.conflict?'bad':''}">${headline(e)}</b><small>${chosen().length} ${t('ticked','เลือกแล้ว')}</small></span>${mini}<span class="cv2">${barOpen?'▴':'▾'}</span></button><button class="clr" data-act="clear">${t('Clear case','ล้างเคส')}</button></div>${barOpen?`<div class="pan">${sumCard(e)}</div>`:''}</div>`}
function sheet(){const e=estimate(),c=chosen();
 return `<div class="sheet"><h1>${t('Time of Death Guide - case sheet','คู่มือประเมินเวลาตาย - ใบสรุปเคส')}</h1>
 <p>${t('Body examined at','ตรวจศพเมื่อ')}: <b>${at?new Date(at).toLocaleString(lang==='th'?'th-TH-u-ca-gregory':'en-GB',{dateStyle:'medium',timeStyle:'short'}):'N/A'}</b></p>
 ${e?`<p>${t('Estimated time since death','เวลาที่ผ่านไปหลังตาย')}: <b>${headline(e)}</b></p>${died(e)?`<p>${t('Died','เสียชีวิต')}: <b>${died(e)}</b></p>`:''}${softTxt(e)?`<p>${softTxt(e)}</p>`:''}${e.conflict?`<p>${t('The ticked signs contradict each other; re-check before using.','สัญญาณที่เลือกขัดแย้งกัน ควรตรวจสอบซ้ำก่อนใช้')}</p>`:''}
 <table class="st"><tr><th>${t('Sign found','สัญญาณที่พบ')}</th><th>${t('Seen at','พบที่เวลา')}</th></tr>${c.map(s=>`<tr><td>${t(s.en,s.th)}</td><td>${range(s)}</td></tr>`).join('')}</table>`
 :`<p>${t('No signs ticked.','ยังไม่ได้เลือกสัญญาณ')}</p>`}
 <p class="fine">${t('Teaching estimate from approximate textbook ranges, not a forensic opinion. Temperature, body size, clothing and setting shift every range.','ค่าประมาณเพื่อการเรียนรู้จากช่วงเวลาในตำรา ไม่ใช่ความเห็นทางนิติเวช อุณหภูมิ รูปร่าง เสื้อผ้า และสถานที่ ทำให้ช่วงเวลาเปลี่ยนไป')}</p>
 <p class="fine">${t('Made by','จัดทำโดย')} Warodom Phaenthong, M.D. · v${CHANGELOG[0].version}</p></div>`}
function modalR(){const X=`<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-act="close">${t('Close','ปิด')}</button>`;let h='';
 if(modal==='log')h=`<h3>${t('Changelog','บันทึกการเปลี่ยนแปลง')}</h3>${CHANGELOG.map(c=>`<h4>v${c.version} · ${c.date}</h4><ul>${c[lang].map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}${X}</div>`;
 else if(modal==='key')h=`<h3>${t('Key','คำอธิบาย')}</h3><ul>
 <li><span class="chip r" style="--c:var(--early)">2 h - 8 h</span> ${t('Time since death in which the sign can be seen. "> 12 h" means no upper limit.','ช่วงเวลาหลังตายที่พบสัญญาณนี้ได้ "> 12 ชม." คือไม่มีขอบบน')}</li>
  <li>${t('Each group of signs has its own icon and colour (rigor, livor, cooling, eyes, decomposition...). The same colour is used on its bar in the chart.','แต่ละกลุ่มสัญญาณมีไอคอนและสีของตัวเอง (ศพแข็ง รอยจ้ำเลือด การเย็นลง ตา การเน่า ฯลฯ) และใช้สีเดียวกันบนแถบในกราฟ')}</li><li><span style="color:var(--early);font-weight:800">■</span> ${t('Early','ระยะแรก')} · <span style="color:var(--late);font-weight:800">■</span> ${t('Late','ระยะหลัง')} ${t('= colour of the section header only.','= สีของหัวข้อหลักเท่านั้น')}</li>
 <li><span style="color:var(--acc);font-weight:800">▮</span> ${t('Shaded band = overlap of every ticked sign.','แถบเงา = ช่วงที่ทับซ้อนกันของทุกสัญญาณ')}</li>
 <li>● ${t('Round = choose one in that group. Square = tick any.','วงกลม = เลือกได้ข้อเดียวในกลุ่ม ช่องสี่เหลี่ยม = ติ๊กได้หลายข้อ')}</li>
 <li>✅ ${t('The range was checked against a published source (rigor, livor, muscle reactions, warm / cold body, adipocere and insect minimums so far).','ช่วงเวลาตรวจเทียบแหล่งตีพิมพ์แล้ว (ขณะนี้ศพแข็ง รอยจ้ำเลือด ปฏิกิริยาของกล้ามเนื้อ ตัวอุ่น/เย็น ไขมันศพ และเวลาขั้นต่ำจากแมลง)')}</li>
 <li><b>i</b> ${t('Opens a note about the sign and whether its range was checked against a source.','เปิดหมายเหตุของสัญญาณ และบอกว่าช่วงเวลาตรวจเทียบกับแหล่งอ้างอิงแล้วหรือไม่')}</li>
 <li>${t('A faded right end in the chart = the end is unknown (no upper limit).','ปลายด้านขวาที่จางลงในกราฟ = ไม่ทราบช่วงสิ้นสุด (ไม่มีขอบบน)')}</li>
 <li>~ 3 d + ${t('is a baseline: a typical figure from Knight or Madea, not a limit. The solid part is the baseline, the faded part is unknown. It is shown, and adds only a soft lower bound under the window.','คือเกณฑ์ทั่วไป: ตัวเลขทั่วไปจาก Knight หรือ Madea ไม่ใช่ขอบเขต ส่วนทึบคือเกณฑ์ ส่วนจางคือไม่ทราบ แสดงไว้ และเพิ่มได้เพียงขอบล่างแบบอ่อนใต้ช่วงเวลา')}</li>
 <li>N/A ${t('= no figure in Knight or Madea. Shown but not used for the window.','= ไม่มีตัวเลขใน Knight หรือ Madea แสดงไว้แต่ไม่ใช้คำนวณช่วงเวลา')}</li></ul>${X}</div>`;
 else if(modal==='tbl')h=tableHtml()+X+'</div>';
 else if(modal==='sheet')h=sheet()+X+(inFrame?'':`<button class="btn o" data-act="print">${t('Print','พิมพ์')}</button>`)+'</div>';
 $('modal').innerHTML=h?`<div class="mod" data-act="close"><div class="mb ${modal==='sheet'||modal==='tbl'?'wide':''}" role="dialog" aria-modal="true">${h}</div></div>`:'';
 $('sheetp').innerHTML=modal==='sheet'?sheet():''}
function refs(){let n=0;$('refs').innerHTML=`<section class="rf"><button class="ch" style="--c:var(--mut)" data-act="refs" aria-expanded="${refsOpen}"><span>${t('References','เอกสารอ้างอิง')}</span><span class="n">${Object.values(REFS).reduce((a,g)=>a+g.items.length,0)}</span><span class="cv">${refsOpen?'▴':'▾'}</span></button>`+(refsOpen?`<div class="sec">`+Object.values(REFS).map(g=>`<h3>${t(g.en,g.th)}</h3><ol>`+g.items.map(r=>{n++;return `<li><b>${n}.</b><div>${esc(r[0])} ${r[1]?`<a href="https://doi.org/${r[1]}" target="_blank" rel="noopener noreferrer">doi:${r[1]}</a>`:''}<small><b>${t('Used for','ใช้สำหรับ')}:</b> ${t(r[2],r[3])}</small></div></li>`}).join('')+'</ol>').join('')+`<p class="fine">${t('Journal articles were found through PubMed. Ranges with a tick are checked against Madea 2023 or Knight 2026; every other sign says "Not verified" in its (i) note.','บทความวารสารค้นผ่าน PubMed ช่วงเวลาที่มีเครื่องหมายถูกตรวจเทียบกับ Madea 2023 หรือ Knight 2026 แล้ว สัญญาณอื่นระบุว่า "ยังไม่ได้ตรวจสอบ" ในหมายเหตุ (i)')}</p></div>`:'')+'</section>'}
function all(){head();list();summary();bar();refs();modalR()}
function keepScroll(f){const y=scrollY;f();scrollTo(0,y)}
const refresh=()=>keepScroll(()=>{list();summary();bar()});

document.addEventListener('click',ev=>{if(casesOpen&&!ev.target.closest('.dd')&&!ev.target.closest('[data-act=cases]')){casesOpen=false;head()}const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(b.classList.contains('mod')&&ev.target!==b)return;
 if(a==='tog'){const s=S.find(x=>x.id===id);if(sel.has(id)){sel.delete(id);infoOpen.delete(id)}else{if(isFam(s))S.filter(x=>x.c===s.c).forEach(x=>{sel.delete(x.id);infoOpen.delete(x.id)});sel.add(id)}refresh()}
 else if(a==='info'){infoOpen.has(id)?infoOpen.delete(id):infoOpen.add(id);keepScroll(list)}
 else if(a==='fold'){closed[id]=!closed[id];keepScroll(list)}
 else if(a==='clear'){sel.clear();infoOpen.clear();nomoOn=false;nomoSign=null;nomoIn={tr:'',ta:'',bw:'',cf:'1',pre:'1',base:'0',baseIdx:0};setting='';refresh()}
 else if(a==='nomo'){nomoOpen=!nomoOpen;keepScroll(list)}
 else if(a==='nomouse'){nomoOn=!nomoOn;nomoUpd();keepScroll(list)}
 else if(a==='refs'){refsOpen=!refsOpen;keepScroll(refs)}
 else if(a==='bar'){barOpen=!barOpen;bar()}
 else if(a==='lang'){lang=lang==='th'?'en':'th';lsSet('tod-lang',lang);keepScroll(all)}
 else if(a==='theme'){const d=document.documentElement.classList.toggle('dark');lsSet('tod-theme',d?'dark':'light');head()}
 else if(a==='log'||a==='key'||a==='sheet'||a==='tbl'){modal=a;modalR()}
 else if(a==='cases'){casesOpen=!casesOpen;head()}
 else if(a==='case'){casesOpen=false;head();nomoOn=false;nomoSign=null;sel.clear();infoOpen.clear();CASES[+id].ids.forEach(x=>sel.add(x));modal=null;barOpen=true;refresh();modalR();scrollTo(0,0)}
 else if(a==='print'){try{window.print()}catch(e){}}
 else if(a==='close'){modal=null;modalR()}});
document.addEventListener('change',ev=>{const el=ev.target;
 if(el.classList.contains('atin')){at=el.value;keepScroll(()=>{summary();bar()})}
 else if(el.dataset.setting){setting=el.value;refresh()}
 else if(el.dataset.pre){nomoIn.pre=el.value;nomoCf();nomoUpd();keepScroll(list)}
 else if(el.dataset.base){nomoIn.baseIdx=el.value;nomoIn.base=NBASE[+el.value][0];nomoCf();nomoUpd();keepScroll(list)}
 else if(el.dataset.fam){S.filter(s=>s.c===el.dataset.fam).forEach(s=>{sel.delete(s.id);infoOpen.delete(s.id)});if(el.value)sel.add(el.value);refresh()}});
document.addEventListener('input',ev=>{if(ev.target.classList.contains('nin')){const k=ev.target.dataset.k;nomoIn[k]=ev.target.value;if(k==='cf'){nomoIn.pre='x';const p=document.querySelector('[data-pre]');if(p)p.value='x'}nomoUpd();return}if(ev.target.id==='q'){q=ev.target.value;keepScroll(list)}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if(casesOpen){casesOpen=false;head();return}if(modal){modal=null;modalR()}else if(barOpen){barOpen=false;bar()}});
all();
</script>
</body>
</html>
